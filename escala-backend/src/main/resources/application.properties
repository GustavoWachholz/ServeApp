spring.application.name=escala-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/servants?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Define como true para limpar todos os dados na inicialização (exceto admin).
# Altere para false após o primeiro restart de testes.
serve.reset-on-startup=true