# ── Perfil de HOMOLOGAÇÃO ────────────────────────────────────────────────────
# Ativado com SPRING_PROFILES_ACTIVE=homolog (ver start-homolog.bat na raiz).
# Roda LOCALMENTE apontando para o BANCO DE PRODUÇÃO (RDS) via túnel SSH.
#
# ⚠️  As demais configs (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ORIGINS)
#     vêm de variáveis de ambiente definidas no start-homolog.bat.

# SEGURANÇA DE SCHEMA: apenas valida que o schema do RDS bate com as entidades.
# NUNCA altera o schema de produção. Se a subida falhar por divergência de schema,
# troque para "none" (não interage com o schema) — mas investigue a divergência antes.
spring.jpa.hibernate.ddl-auto=validate

# ⚠️  Flyway DESLIGADO em homologação: este perfil conecta no RDS de PRODUÇÃO. Migração de
# schema de prod é uma ação de DEPLOY controlada (na EC2), nunca efeito colateral de um boot
# de dev. Aqui só validamos o schema real como está.
spring.flyway.enabled=false

# Trava dupla: jamais limpar dados apontando para produção.
serve.reset-on-startup=false

# Menos ruído/log em homologação (não loga SQL nem estrutura do banco de prod).
spring.jpa.show-sql=false
logging.level.com.servants=INFO
logging.level.org.hibernate.SQL=WARN
