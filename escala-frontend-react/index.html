<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serve</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('serve_session') || '{}');
          if (s.tema === 'dark' || s.tema === 'ardosia') {
            document.documentElement.classList.add('dark-mode');
            document.body && document.body.classList.add('dark-mode');
          }
          if (s.tema === 'ardosia') {
            document.documentElement.classList.add('ardosia-mode');
            document.body && document.body.classList.add('ardosia-mode');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
