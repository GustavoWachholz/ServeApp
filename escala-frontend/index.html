<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Serve</title>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/auth.js"></script>
    <script src="js/igreja-cache.js"></script>
    <script>Auth.restaurarTema(); Auth.restaurarSidebar(); Auth.marcarPapel(); if (!Auth.redirecionarParaShell()) Auth.exigirLogin();</script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Recolher menu"><i class="fas fa-angles-left"></i></button>
            <div class="sidebar-logo">
                <img src="assets/img/logo_t.png" alt="Serve" class="logo-full" style="max-width: 130px; height: auto; display: block; margin: 0 auto;">
                <img src="assets/img/logo_mini_t.png" alt="S." class="logo-mini" style="max-width: 44px; height: auto; margin: 0 auto;">
            </div>
            <div class="user-profile">
                <div class="avatar-wrapper">
                    <img src="https://ui-avatars.com/api/?name=User&background=004b87&color=fff" alt="User Avatar" id="user-avatar">
                </div>
                <div class="user-info">
                    <h3><span id="user-name-display">Carregando...</span></h3>
                    <span class="user-role">Administrador</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="#"><i class="fas fa-home"></i> <span>Home</span></a></li>
                    <li class="nav-group">
                        <button type="button" class="nav-group-toggle"><i class="fas fa-folder-open"></i> <span>Cadastros</span><i class="fas fa-chevron-down nav-caret"></i></button>
                        <ul class="nav-submenu">
                            <li data-tela="AGENDA"><a href="agenda.html"><i class="fas fa-calendar-check"></i> <span>Agenda / Escalas</span></a></li>
                            <li data-tela="SERVOS"><a href="voluntarios.html"><i class="fas fa-users"></i> <span>Servos</span></a></li>
                            <li data-tela="AREAS"><a href="ministerios.html"><i class="fas fa-church"></i> <span>Áreas</span></a></li>
                            <li data-tela="MINISTERIOS"><a href="configuracao-escala.html"><i class="fas fa-tags"></i> <span>Ministérios</span></a></li>
                        </ul>
                    </li>
                    <li><a href="relatorios.html"><i class="fas fa-chart-pie"></i> <span>Relatórios</span></a></li>
                    <li class="nav-admin-only"><a href="usuarios.html"><i class="fas fa-user-shield"></i> <span>Usuários</span></a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <!-- Menu Flutuante de Configurações -->
                <div id="settings-menu" class="settings-popover">
                    <div class="popover-header">
                        <span>Aparência</span>
                    </div>
                    <div class="settings-group">
                        <div class="setting-item">
                            <label for="theme-toggle">Modo Escuro</label>
                            <label class="switch">
                                <input type="checkbox" id="theme-toggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label for="color-picker">Cor Principal</label>
                            <input type="color" id="color-picker" value="#004b87">
                        </div>
                    </div>
                </div>

                <button id="settings-btn" class="sidebar-btn">
                    <i class="fas fa-cog"></i> <span>Configurações</span>
                </button>
                <button id="logout-btn" class="sidebar-btn">
                    <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="loading-overlay"><div class="loading-spinner"></div><p>Carregando…</p></div>
            <header class="main-header">
                <h1 class="logo-title"><span>Serve</span></h1>
            </header>

            <div class="dashboard-grid">
                <!-- Próximos Compromissos -->
                <section class="dashboard-section">
                    <div class="section-header">
                        <h2>PRÓXIMOS COMPROMISSOS</h2>
                        <div style="display:flex;align-items:center;gap:1rem;">
                            <div class="periodo-toggle" id="periodo-toggle">
                                <button type="button" class="periodo-btn active" data-periodo="semana">Semana</button>
                                <button type="button" class="periodo-btn" data-periodo="mes">Mês</button>
                            </div>
                            <a href="#" class="see-all" id="ver-todos-compromissos">Ver todos ></a>
                        </div>
                    </div>
                    <div id="container-proximos-compromissos" class="cards-row"></div>
                </section>

                <!-- Aniversariantes -->
                <section class="dashboard-section">
                    <div class="section-header">
                        <h2>ANIVERSARIANTES</h2>
                        <a href="#" class="see-all" id="ver-todos-aniversariantes">Ver todos ></a>
                    </div>
                    <div id="container-aniversariantes" class="cards-container"></div>
                </section>

                <!-- Quadro de Avisos -->
                <section class="dashboard-section">
                    <div class="section-header">
                        <h2>QUADRO DE AVISOS</h2>
                        <button type="button" id="btn-novo-aviso" class="btn-primary btn-sm" style="display:none; padding:0.35rem 0.8rem; font-size:0.82rem;">
                            <i class="fas fa-plus"></i> Novo Aviso
                        </button>
                    </div>
                    <div id="container-avisos" class="cards-container"></div>
                </section>

                <!-- Minhas Escalas -->
                <section class="dashboard-section">
                    <div class="section-header">
                        <h2>MINHAS ESCALAS</h2>
                    </div>
                    <div id="container-minhas-escalas" class="cards-row"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal Aviso (Admin) -->
    <div id="aviso-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="aviso-modal-titulo">Novo Aviso</h2>
                <span class="close-modal" id="aviso-modal-close">&times;</span>
            </div>
            <form id="aviso-form" style="padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
                <input type="hidden" id="aviso-id">
                <div class="form-group">
                    <label for="aviso-titulo-input">Título</label>
                    <input type="text" id="aviso-titulo-input" required placeholder="Título do aviso">
                </div>
                <div class="form-group">
                    <label for="aviso-texto-input">Mensagem</label>
                    <textarea id="aviso-texto-input" rows="4" required placeholder="Texto do aviso" style="resize:vertical;width:100%;"></textarea>
                </div>
                <div class="form-group">
                    <label for="aviso-validade-input">Válido até <small style="color:var(--text-muted);">(opcional)</small></label>
                    <input type="date" id="aviso-validade-input">
                </div>
                <button type="submit" id="aviso-submit" class="btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <!-- Modal genérico de listagem ("Ver todos") -->
    <div id="lista-modal" class="modal">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <h2 id="lista-modal-titulo">Lista</h2>
                <span class="close-modal" id="lista-modal-close">&times;</span>
            </div>
            <div id="lista-modal-body" style="max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
