spring.application.name=escala-backend

# ── Banco de Dados ──────────────────────────────────────────────────────────
# Configure via variáveis de ambiente em produção:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# PRODUÇÃO (LGPD Art. 46): use useSSL=true e configure certificado TLS no MySQL.
# Exemplo de produção: jdbc:mysql://HOST:3306/serve?useSSL=true&requireSSL=true&...
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/serve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# PRODUÇÃO: defina SHOW_SQL=false para não logar SQL (reduz ruído e não expõe estrutura).
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ─────────────────────────────────────────────────────────────────────
# OBRIGATÓRIO: defina JWT_SECRET no ambiente antes de iniciar (mín. 32 chars).
# A aplicação recusa iniciar se JWT_SECRET não estiver definida.
# Exemplo: export JWT_SECRET=$(openssl rand -base64 48)
serve.jwt.secret=${JWT_SECRET}
# Expiração do token: 8 horas em ms (28800000). Ajuste via JWT_EXPIRATION_MS.
serve.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── CORS ────────────────────────────────────────────────────────────────────
# Em produção, restrinja para a URL real do frontend. Configure via CORS_ORIGINS.
serve.cors.origins=${CORS_ORIGINS:http://localhost:*}

# ── Rate Limiting (Login) ───────────────────────────────────────────────────
serve.rate-limit.max-tentativas=10
serve.rate-limit.janela-ms=60000

# ── Logging (LGPD Art. 37 / 46) ─────────────────────────────────────────────
# PRODUÇÃO: defina LOG_LEVEL_APP=INFO (não logar SQL nem dados internos).
logging.level.com.servants=${LOG_LEVEL_APP:DEBUG}
# PRODUÇÃO: defina LOG_LEVEL_HIBERNATE=WARN para silenciar SQL do Hibernate.
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:DEBUG}
logging.level.org.hibernate.type.descriptor.sql=WARN

# ── Comportamento na inicialização ──────────────────────────────────────────
# true = limpa todos os dados (exceto admin) no startup. Útil para testes.
serve.reset-on-startup=false
