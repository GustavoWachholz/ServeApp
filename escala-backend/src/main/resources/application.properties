spring.application.name=escala-backend

# ── Banco de Dados ──────────────────────────────────────────────────────────
# Configure via variáveis de ambiente em produção:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servants?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ─────────────────────────────────────────────────────────────────────
# IMPORTANTE: troque JWT_SECRET por um segredo forte antes de ir para produção.
# Mínimo 32 caracteres. Configure via variável de ambiente JWT_SECRET.
serve.jwt.secret=${JWT_SECRET:serve-dev-only-secret-key-change-before-going-to-production!}
# Expiração do token: 8 horas em ms (28800000). Ajuste via JWT_EXPIRATION_MS.
serve.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── CORS ────────────────────────────────────────────────────────────────────
# Em produção, restrinja para a URL real do frontend. Configure via CORS_ORIGINS.
serve.cors.origins=${CORS_ORIGINS:http://localhost:*}

# ── Rate Limiting (Login) ───────────────────────────────────────────────────
serve.rate-limit.max-tentativas=10
serve.rate-limit.janela-ms=60000

# ── Comportamento na inicialização ──────────────────────────────────────────
# true = limpa todos os dados (exceto admin) no startup. Útil para testes.
serve.reset-on-startup=false
